name: Automatic update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [aster-release]

concurrency:
  group: automatic-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Flatpak External Data Checker
        uses: docker://ghcr.io/flathub-infra/flatpak-external-data-checker:latest
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: '*'
        with:
          args: --update --edit-only org.astermail.Mail.yml

      - name: Check for a new release
        id: check
        run: |
          if git diff --quiet -- org.astermail.Mail.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- org.astermail.Mail.yml
          fi

      - name: Generate Sources
        if: steps.check.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml python3-venv
          ./generate-sources.sh

      - name: Create Pull Request
        id: create-pr
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: Flatpak External Data Checker <41898282+github-actions[bot]@users.noreply.github.com>
          author: Flatpak External Data Checker <41898282+github-actions[bot]@users.noreply.github.com>
          base: master
          branch: update-master
          delete-branch: true
          commit-message: |
            update: astermail and offline sources
          title: |
            Automatic Aster-Mail source re-generation and update
          body: |
            This pull request was automatically generated by a automatic workflow started by a repository dispatch.

            Runs [Flatpak External Data Checker](https://github.com/flathub-infra/flatpak-external-data-checker) to update the upstream source and re-generates source metadata using generate-sources.sh.

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge --merge --auto "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
